<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GED Math Practice Test - 30 Questions</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <header>
      <h1>GED Mathematics Practice Test</h1>
      <p>Functions • Linear Equations • Graphing</p>

      <div class="timer-box">
        Time Remaining:
        <span id="timer">45:00</span>
      </div>
    </header>

    <div id="start-screen">
      <h2>Instructions</h2>

      <ul>
        <li>30 questions</li>
        <li>45-minute time limit</li>
        <li>Questions are shuffled</li>
        <li>Answer choices are shuffled</li>
        <li>You can submit only once</li>
        <li>Your score will appear after submission</li>
      </ul>

      <button id="startBtn">Start Test</button>
    </div>

    <form id="quizForm"></form>

    <div id="submit-area">
      <button id="submitBtn">Submit Test</button>
    </div>

    <div id="result"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
